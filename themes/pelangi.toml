# Pelangi — a rainbow reading theme: every heading level has its own colour.
# Copy this file to <config>/mnemonic/themes/ or <vault>/.mnemonic/themes/
# under a new name to make your own theme (see docs/themes.md).
name = "Pelangi"
author = "MNEMONIC"
description = "Rainbow headings, playful accents; prints in full colour."

[light]
background = "#fffdf8"
text = "#2d2a32"
muted = "#6b6570"
strong = "#c2185b"
link = "#1e88e5"
tag = "#8e24aa"
h1 = "#e53935"
h2 = "#f57c00"
h3 = "#c79100"
h4 = "#43a047"
h5 = "#1e88e5"
h6 = "#8e24aa"
code_text = "#ad1457"
code_bg = "#fff1e0"
quote_bar = "#ffb74d"
rule = "#f8bbd0"
table_border = "#f0d9e6"
table_header_bg = "#fde7f3"
highlight_bg = "#fff59d"
checkbox = "#43a047"
callout_note = "#1e88e5"
callout_tip = "#00897b"
callout_important = "#8e24aa"
callout_warning = "#f57c00"
callout_caution = "#e53935"
callout_quote = "#757575"

[dark]
background = "#1b1a22"
text = "#ecebf2"
muted = "#a8a3b3"
strong = "#ff80ab"
link = "#64b5f6"
tag = "#ce93d8"
h1 = "#ff6b6b"
h2 = "#ffa94d"
h3 = "#ffd43b"
h4 = "#69db7c"
h5 = "#74c0fc"
h6 = "#da77f2"
code_text = "#ffab91"
code_bg = "#26242f"
quote_bar = "#ffa94d"
rule = "#3a3645"
table_border = "#3a3645"
table_header_bg = "#2a2733"
highlight_bg = "#5c4f1a"
checkbox = "#69db7c"
callout_note = "#74c0fc"
callout_tip = "#63e6be"
callout_important = "#da77f2"
callout_warning = "#ffa94d"
callout_caution = "#ff6b6b"
callout_quote = "#adb5bd"
