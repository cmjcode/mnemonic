# Print Classic — white paper, near-black text, navy accents. Ink-friendly
# while keeping callouts and links in colour. Only [light] is set, so dark
# mode on screen uses the default Mnemonic dark colours.
name = "Print Classic"
author = "MNEMONIC"
description = "White paper and navy accents; ink-friendly printing."

[light]
background = "#ffffff"
text = "#111111"
muted = "#555555"
strong = "#111111"
link = "#1a4d8f"
tag = "#1a4d8f"
h1 = "#1a4d8f"
h2 = "#1a4d8f"
h3 = "#333333"
h4 = "#333333"
h5 = "#555555"
h6 = "#555555"
code_text = "#222222"
code_bg = "#f3f3f3"
quote_bar = "#999999"
rule = "#cccccc"
table_border = "#bbbbbb"
table_header_bg = "#eeeeee"
highlight_bg = "#fff3a0"
checkbox = "#1a4d8f"
callout_note = "#1a4d8f"
callout_tip = "#2e7d32"
callout_important = "#6a1b9a"
callout_warning = "#b26a00"
callout_caution = "#b71c1c"
callout_quote = "#555555"
